<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA FPS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-pad" viewBox="0 0 24 24"><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
<symbol id="i-rocket" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></symbol>
<symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
<symbol id="i-city" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
<symbol id="i-rain" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M16 14v6M8 14v6M12 16v6"/></symbol>
<symbol id="i-storm" viewBox="0 0 24 24"><path d="M6 16.3A4.5 4.5 0 0 1 7.5 8h1.8A7 7 0 1 1 18 14.5"/><path d="m13 12-3 5h4l-3 5"/></symbol>
<symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M16 17H7M17 21H9"/></symbol>
<symbol id="i-snow" viewBox="0 0 24 24"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></symbol>
<symbol id="i-night" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
</defs></svg>
    <div id="app" class="hidden">
        <div class="boost" id="panel">

            <div class="meter">
                <div class="meter-num"><b id="fps-value">60</b><small>FPS</small></div>
                <div class="meter-bar"><div id="fps-fill"></div></div>
                <div class="meter-row"><span id="fps-state">SMOOTH</span><span id="current-mode">NORMAL</span></div>
            </div>

            <div class="sec">Performance mode</div>
            <div class="cards">
                <button class="card" data-mode="fps" onclick="selectMode('fps')"><span class="ci"><svg class="ic"><use href="#i-zap"/></svg></span><span class="ct"><b>FPS Mode</b><small>Light cut</small></span></button>
                <button class="card" data-mode="boost" onclick="selectMode('boost')"><span class="ci"><svg class="ic"><use href="#i-rocket"/></svg></span><span class="ct"><b>Boost</b><small>No shadows, low LOD</small></span></button>
                <button class="card" data-mode="low" onclick="selectMode('low')"><span class="ci"><svg class="ic"><use href="#i-cpu"/></svg></span><span class="ct"><b>Low Spec</b><small>Minimum visuals</small></span></button>
                <button class="card" data-mode="beast" onclick="selectMode('beast')"><span class="ci"><svg class="ic"><use href="#i-flame"/></svg></span><span class="ct"><b>Beast</b><small>Maximum smart cut</small></span></button>
                <button class="card" data-mode="ultra" onclick="selectMode('ultra')"><span class="ci"><svg class="ic"><use href="#i-gauge"/></svg></span><span class="ct"><b>Ultra</b><small>Blackout, max cut</small></span></button>
                <button class="card" data-mode="citizen" onclick="selectMode('citizen')"><span class="ci"><svg class="ic"><use href="#i-city"/></svg></span><span class="ct"><b>Citizen</b><small>Pretty, smart cut</small></span></button>
            </div>

            <div class="sec">Weather (only you)</div>
            <div class="cards">
                <button class="card wx on" data-weather="sun" onclick="selectWeather('sun')"><span class="ci"><svg class="ic"><use href="#i-sun"/></svg></span><span class="ct"><b>Sun</b></span></button>
                <button class="card wx" data-weather="rain" onclick="selectWeather('rain')"><span class="ci"><svg class="ic"><use href="#i-rain"/></svg></span><span class="ct"><b>Rain</b></span></button>
                <button class="card wx" data-weather="storm" onclick="selectWeather('storm')"><span class="ci"><svg class="ic"><use href="#i-storm"/></svg></span><span class="ct"><b>Storm</b></span></button>
                <button class="card wx" data-weather="fog" onclick="selectWeather('fog')"><span class="ci"><svg class="ic"><use href="#i-fog"/></svg></span><span class="ct"><b>Fog</b></span></button>
                <button class="card wx" data-weather="snow" onclick="selectWeather('snow')"><span class="ci"><svg class="ic"><use href="#i-snow"/></svg></span><span class="ct"><b>Snow</b></span></button>
                <button class="card wx" data-weather="night" onclick="selectWeather('night')"><span class="ci"><svg class="ic"><use href="#i-night"/></svg></span><span class="ct"><b>Night</b></span></button>
            </div>

            <div class="sec">Boosters</div>
            <div class="toggles">
                <label class="trow" id="row-shadows"><span>Shadows<small>Cascade shadows</small></span><span class="sw"><input type="checkbox" id="sw-shadows" checked onchange="toggleSetting('shadows')"><span class="sl"></span></span></label>
                <label class="trow" id="row-particles"><span>Particles<small>Effects and smoke</small></span><span class="sw"><input type="checkbox" id="sw-particles" checked onchange="toggleSetting('particles')"><span class="sl"></span></span></label>
                <label class="trow" id="row-density"><span>NPC &amp; Vehicles<small>World density</small></span><span class="sw"><input type="checkbox" id="sw-density" checked onchange="toggleSetting('density')"><span class="sl"></span></span></label>
                <label class="trow" id="row-parked"><span>Parked Cars<small>Static traffic</small></span><span class="sw"><input type="checkbox" id="sw-parked" checked onchange="toggleSetting('parked')"><span class="sl"></span></span></label>
                <label class="trow" id="row-lod"><span>LOD Distance<small>Draw distance</small></span><span class="sw"><input type="checkbox" id="sw-lod" checked onchange="toggleSetting('lod')"><span class="sl"></span></span></label>
                <label class="trow" id="row-lights"><span>City Lights<small>Street blackout</small></span><span class="sw"><input type="checkbox" id="sw-lights" checked onchange="toggleSetting('lights')"><span class="sl"></span></span></label>
                <label class="trow" id="row-distant"><span>Distant Lights<small>Far car lights</small></span><span class="sw"><input type="checkbox" id="sw-distant" checked onchange="toggleSetting('distant')"><span class="sl"></span></span></label>
                <label class="trow" id="row-gen"><span>Vehicle Generators<small>Spawn points</small></span><span class="sw"><input type="checkbox" id="sw-gen" checked onchange="toggleSetting('gen')"><span class="sl"></span></span></label>
                <label class="trow" id="row-fires"><span>Fires<small>Auto extinguish</small></span><span class="sw"><input type="checkbox" id="sw-fires" checked onchange="toggleSetting('fires')"><span class="sl"></span></span></label>
            </div>

            <div class="ops">
                <button class="op nuke" onclick="cleanLag()"><svg class="ic"><use href="#i-trash"/></svg>Clean lag</button>
                <button class="op" onclick="restartSettings()"><svg class="ic"><use href="#i-reset"/></svg>Normal</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
